<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Register | Crumbs & Cakes</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <link href="/img/favicon.ico" rel="icon">

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Oswald:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet"> 
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>

<body>
  <!-- Topbar -->
  <div class="container-fluid px-0 d-none d-lg-block">
    <div class="row gx-0">
      <div class="col-lg-4 text-center bg-secondary py-3">
        <div class="d-inline-flex align-items-center justify-content-center">
          <i class="bi bi-envelope fs-1 text-primary me-3"></i>
          <div class="text-start">
            <h6 class="text-uppercase mb-1">Email Us</h6>
            <span>contact@crumbsandcakes.com</span>
          </div>
        </div>
      </div>
      <div class="col-lg-4 text-center bg-primary border-inner py-3">
        <div class="d-inline-flex align-items-center justify-content-center">
          <a th:href="@{/}" class="navbar-brand">
            <h1 class="m-0 text-uppercase text-white"><i class="fa fa-birthday-cake fs-1 text-dark me-3"></i>Crumbs & Cakes</h1>
          </a>
        </div>
      </div>
      <div class="col-lg-4 text-center bg-secondary py-3">
        <div class="d-inline-flex align-items-center justify-content-center">
          <i class="bi bi-phone-vibrate fs-1 text-primary me-3"></i>
          <div class="text-start">
            <h6 class="text-uppercase mb-1">Call Us</h6>
            <span>+91 63817 81640</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <div class="container-fluid bg-dark bg-img p-5 mb-5">
    <div class="row">
      <div class="col-12 text-center">
        <h1 class="display-4 text-uppercase text-white">Register</h1>
        <a th:href="@{/}">Home</a>
        <i class="far fa-square text-primary px-2"></i>
        <a th:href="@{/register}">Register</a>
      </div>
    </div>
  </div>

  <!-- Registration Form -->
  <div class="container-fluid py-5">
    <div class="container">
      <div class="row g-5 justify-content-center">
        <div class="col-lg-6">
          <div class="bg-secondary border-inner text-center text-white p-5">
            <h4 class="text-uppercase mb-3">Create Your Account</h4>

            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

            <form th:action="@{/register}" method="post" onsubmit="return validateForm()">
              <div class="form-group mb-4">
                <label style="color:black;" for="register-name" class="form-label">Full Name</label>
                <input type="text" class="form-control border-white p-3" id="register-name" name="register-name" placeholder="Enter your full name" required>
              </div>
              <div class="form-group mb-4">
                <label style="color:black;" for="register-email" class="form-label">Email Address</label>
                <input type="email" class="form-control border-white p-3" id="register-email" name="register-email" placeholder="Enter your email" required>
              </div>
              <div class="form-group mb-4">
                <label style="color:black;" for="register-password" class="form-label">Password</label>
                <input type="password" class="form-control border-white p-3" id="register-password" name="register-password" placeholder="Create a password" required>
              </div>
              <div class="form-group mb-4">
                <label style="color:black;" for="register-confirm-password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control border-white p-3" id="register-confirm-password" name="register-confirm-password" placeholder="Confirm your password" required>
              </div>
              <button type="submit" class="btn btn-dark border-inner py-3 px-5">Register</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="container-fluid bg-dark bg-img text-secondary" style="margin-top:135px;">
    <div class="container text-center py-4">
      <p class="m-0">&copy; 2025 Crumbs & Cakes. All Rights Reserved.</p>
    </div>
  </div>

  <a href="#" class="btn btn-primary border-inner py-3 fs-4 back-to-top"><i class="bi bi-arrow-up"></i></a>

  <script>
    function validateForm() {
        var password = document.getElementById("register-password").value;
        var confirmPassword = document.getElementById("register-confirm-password").value;

        if (password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return false;
        }

        if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return false;
        }

        return true;
    }
    </script>


  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/lib/easing/easing.min.js"></script>
  <script src="/lib/waypoints/waypoints.min.js"></script>
  <script src="/lib/counterup/counterup.min.js"></script>
  <script src="/lib/owlcarousel/owl.carousel.min.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
