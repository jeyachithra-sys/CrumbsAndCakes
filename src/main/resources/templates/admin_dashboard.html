<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Crumbs & Cakes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link th:href="@{/img/favicon.ico}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Oswald:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet"> 

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
    <!-- Topbar Start -->
    <div class="container-fluid px-0 d-none d-lg-block">
        <div class="row gx-0">
            <div class="col-lg-4 text-center bg-secondary py-3">
                <div class="d-inline-flex align-items-center justify-content-center">
                    <i class="bi bi-person fs-1 text-primary me-3"></i>
                    <div class="text-start">
                        <h6 class="text-uppercase mb-1">Logged in as</h6>
                        <span th:text="${adminName}">Admin</span>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 text-center bg-primary border-inner py-3">
                <div class="d-inline-flex align-items-center justify-content-center">
                    <a th:href="@{/admin/dashboard}" class="navbar-brand">
                        <h1 class="m-0 text-uppercase text-white">
                            <i class="fa fa-birthday-cake fs-1 text-dark me-3"></i>Crumbs & Cakes
                        </h1>
                    </a>
                </div>
            </div>
            <div class="col-lg-4 text-center bg-secondary py-3">
                <div class="d-inline-flex align-items-center justify-content-center">
                    <a th:href="@{/admin/logout}" class="btn btn-danger">Logout</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Topbar End -->

    <!-- Admin Dashboard -->
    <div class="container">
        <h1 class="text-center my-4">Welcome to the Admin Dashboard!</h1>
        <nav>
            <ul class="nav justify-content-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/manage_orders}">Manage Orders</a>

                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/manage_inventory}">Manage Inventory</a>
                </li>
            </ul>
        </nav><br>

        <center>
            <div class="content">
                <h2>Dashboard Overview</h2>
                <p>Here you can manage orders, inventory, and more.</p>
            </div>
        </center>
    </div><br><br><br><br><br>

    <!-- Footer Start -->
    <div class="container-fluid bg-dark text-light py-4" style="background: #111111;">
        <div class="container text-center">
            <p class="mb-0">
                &copy; <a class="text-primary" href="#">Crumbs & Cakes</a>.
                All Rights Reserved. Designed by <a class="text-white border-bottom">Jeya Chithra</a>
            </p>
        </div>
    </div>
    <!-- Footer End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square rounded-circle back-to-top">
        <i class="bi bi-arrow-up"></i>
    </a>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>
    <script th:src="@{/lib/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
