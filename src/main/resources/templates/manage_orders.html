<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Crumbs & Cakes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link th:href="@{/img/favicon.ico}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Oswald:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet"> 

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<body>
    <!-- Topbar Start -->
    <div class="container-fluid px-0 d-none d-lg-block">
        <div class="row gx-0">
            <div class="col-lg-4 text-center bg-secondary py-3">
                <div class="d-inline-flex align-items-center justify-content-center">
                    <i class="bi bi-person fs-1 text-primary me-3"></i>
                    <div class="text-start">
                        <h6 class="text-uppercase mb-1">Logged in as</h6>
                        <span th:text="${adminName}">Admin</span>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 text-center bg-primary border-inner py-3">
                <div class="d-inline-flex align-items-center justify-content-center">
                    <a th:href="@{/admin/dashboard}" class="navbar-brand">
                        <h1 class="m-0 text-uppercase text-white">
                            <i class="fa fa-birthday-cake fs-1 text-dark me-3"></i>Crumbs & Cakes
                        </h1>
                    </a>
                </div>
            </div>
            <div class="col-lg-4 text-center bg-secondary py-3">
                <div class="d-inline-flex align-items-center justify-content-center">
                    <a th:href="@{/admin/logout}" class="btn btn-danger">Logout</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Topbar End -->
<div class="container mt-5">
    <h1 class="text-center mb-4">Manage Orders</h1>

    <div th:if="${session.status_message}" class="alert alert-info text-center">
        <span th:text="${session.status_message}"></span>
    </div>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Order ID</th>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Payment Method</th>
            <th>Status</th>
            <th>Created At</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.customer_name}"></td>
            <td th:text="${order.customer_email}"></td>
            <td th:text="${order.customer_phone}"></td>
            <td th:text="${order.customer_address}"></td>
            <td th:text="${order.payment_method}"></td>
            <td th:text="${order.order_status}"></td>
            <td th:text="${#temporals.format(order.created_at, 'yyyy-MM-dd HH:mm')}"></td>

            <td>
                <form method="post" action="/admin/update-order-status">
                    <input type="hidden" name="order_id" th:value="${order.id}">
                    <select name="order_status" class="form-select mb-2">
                        <option value="Pending" th:selected="${order.order_status == 'Pending'}">Pending</option>
                        <option value="Delivered" th:selected="${order.order_status == 'Delivered'}">Delivered</option>
                        <option value="Cancelled" th:selected="${order.order_status == 'Cancelled'}">Cancelled</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Update</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="container-fluid bg-dark text-light py-4">
    <div class="container text-center">
        <p class="mb-0">&copy; <a class="text-primary" href="#">Crumbs & Cakes</a>.
            All Rights Reserved. Designed by <a class="text-white border-bottom">Jeya Chithra</a></p>
    </div>
</div>

<a href="#" class="btn btn-lg btn-primary btn-lg-square rounded-circle back-to-top">
    <i class="bi bi-arrow-up"></i>
</a>

<script src="/lib/jquery/jquery.min.js"></script>
<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
